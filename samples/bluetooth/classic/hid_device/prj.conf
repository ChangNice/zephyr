# Bluetooth HID Device Demo configuration
# Simulates a Bluetooth Classic mouse (3-button + XY axes)
#
# Build:
#   west build -p -b mimxrt1170_evk@B/mimxrt1176/cm7 samples/bluetooth/classic/hid_device

# Core Bluetooth (BR/EDR)
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="Zephyr HID Mouse"
CONFIG_BT_CLASSIC=y
CONFIG_BT_SMP=y
CONFIG_BT_MAX_CONN=1

# Class of Device: Peripheral / Pointing Device (Mouse) = 0x002580
CONFIG_BT_COD=0x002580

# HID Profile
CONFIG_BT_HID=y
CONFIG_BT_HID_DEVICE=y
CONFIG_BT_HID_DEVICE_MAX_CONN=1
CONFIG_BT_HID_DEVICE_MAX_REPORT_DESC_LEN=128
CONFIG_BT_HID_TX_BUF_COUNT=8
CONFIG_BT_HID_TX_BUF_SIZE=64

# Logging
CONFIG_LOG=y
CONFIG_BT_HID_LOG_LEVEL=3

# System work queue stack
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

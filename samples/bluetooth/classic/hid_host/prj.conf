# Bluetooth HID Host Demo configuration
# Scans for HID Devices, connects, and prints received Input reports
#
# Build:
#   west build -p -b mimxrt1170_evk@B/mimxrt1176/cm7 samples/bluetooth/classic/hid_host

# Core Bluetooth (BR/EDR)
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="Zephyr HID Host"
CONFIG_BT_CLASSIC=y
CONFIG_BT_SMP=y
CONFIG_BT_MAX_CONN=2

# HID Profile
CONFIG_BT_HID=y
CONFIG_BT_HID_HOST=y
CONFIG_BT_HID_HOST_MAX_CONN=2
CONFIG_BT_HID_TX_BUF_COUNT=8
CONFIG_BT_HID_TX_BUF_SIZE=672

# Logging
CONFIG_LOG=y
CONFIG_BT_HID_LOG_LEVEL=3

# System work queue stack
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
